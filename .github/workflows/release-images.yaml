# WMS-602: только ручной запуск на default branch; environment ghcr-release требует внешней настройки reviewers.
# Ручной запуск требует явного поручения оператора и approval environment; WMS-602 release разрешён пользователем.
name: Release images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghcr-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/validate.yaml
    with:
      export-images: true
  publish:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: ghcr-release
    outputs:
      backend: ${{ steps.publish.outputs.backend }}
      web: ${{ steps.publish.outputs.web }}
      backend-config: ${{ steps.publish.outputs.backend-config }}
      web-config: ${{ steps.publish.outputs.web-config }}
    permissions:
      contents: read
      packages: write
    steps:
      # Нет checkout и исполнения candidate scripts с packages:write token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-images
          path: release
      - name: Publish exact checked images and verify registry pull
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          test "$(cat commit.txt)" = "$GITHUB_SHA"
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf 'commit\timage\tdigest\n' > digests.tsv
          for app in backend web; do
            docker load -i "$app.tar"
            source_id="$(docker image inspect "warehouse-$app:local" --format '{{.Id}}')"
            image="ghcr.io/${GITHUB_REPOSITORY,,}/$app"
            tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker tag "$source_id" "$image:$tag"
            checked_config="$(jq -r --arg app "$app" '.images[] | select(.app == $app) | .configId' export-evidence.json)"
            [[ "$checked_config" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker push "$image:$tag"
            canonical="$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')"
            test "${canonical%@*}" = "$image"
            [[ "${canonical#*@}" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker pull "$canonical"
            printf '%s=%s\n' "$app" "$canonical" >> "$GITHUB_OUTPUT"
            printf '%s-config=%s\n' "$app" "$checked_config" >> "$GITHUB_OUTPUT"
            printf '%s\t%s\t%s\n' "$GITHUB_SHA" "$image" "${canonical#*@}" >> digests.tsv
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-digests
          path: release/digests.tsv
          if-no-files-found: warn
          retention-days: 90

  verify-pull:
    needs: publish
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
      - name: Install pinned ARM64 pull tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pull-tools"
          curl --fail --location --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-arm64 -o "$RUNNER_TEMP/pull-tools/kind"
          echo "20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2  $RUNNER_TEMP/pull-tools/kind" | sha256sum --check
          curl --fail --location --retry 3 https://dl.k8s.io/release/v1.37.0/bin/linux/arm64/kubectl -o "$RUNNER_TEMP/pull-tools/kubectl"
          echo "922df28df248cc00a9e025f947704f1d1482de64ece54cfe57e61f19eaf1eef3  $RUNNER_TEMP/pull-tools/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/pull-tools/kind" "$RUNNER_TEMP/pull-tools/kubectl"
          echo "$RUNNER_TEMP/pull-tools" >> "$GITHUB_PATH"
      # Новая VM и новый cluster; никаких local images/import. Token имеет только packages:read.
      - name: Verify fresh kind registry pull and cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BACKEND_REF: ${{ needs.publish.outputs.backend }}
          RELEASE_WEB_REF: ${{ needs.publish.outputs.web }}
          RELEASE_BACKEND_CONFIG: ${{ needs.publish.outputs.backend-config }}
          RELEASE_WEB_CONFIG: ${{ needs.publish.outputs.web-config }}
        run: node scripts/image-release/pull-kind.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: target-pull-evidence
          path: artifacts/release-pull/evidence.json
          if-no-files-found: warn
          retention-days: 90
