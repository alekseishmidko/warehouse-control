{{/* Только cluster-internal HTTP. Gateway/TLS добавляются отдельным WMS-303. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 3000
      targetPort: http
