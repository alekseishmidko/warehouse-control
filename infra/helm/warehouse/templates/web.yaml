{{/* Назначение: optional static origin собранной SPA, отдельный image digest без backend dependencies.
Ход: web.enabled → Deployment/Service → static server слушает8080 → readiness GET/ → Gateway передаёт UI/assets.
/api идёт напрямую API Service; web server не выполняет auth/proxy и никогда не получает DB/session Secret.
Без включения template не создаёт ресурсов. External web Service можно выбрать через gateway.webService. */}}
{{/* Static server не проксирует API и не содержит session credentials. Gateway выбирает backend по prefix. */}}
{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
spec:
  {{/* Одна replica для локальной проверки; это не HA и не доказательство непрерывного rollout. */}}
  replicas: 1
  {{/* Instance+component совпадают с Pod labels и нижним Service; отделяют web от backend. */}}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      {{/* Общий runtime SA без API token: static origin не использует Kubernetes API. */}}
      serviceAccountName: {{ .Release.Name }}-runtime
      automountServiceAccountToken: false
      {{/* Не-root UID/GID1000 совпадают с image USER node; seccomp использует профиль runtime. */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          {{/* Только repository@digest; lock web artifact независим от общего backend digest API/worker/migrator. */}}
          image: {{ printf "%s@%s" .Values.web.image.repository .Values.web.image.digest | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          {{/* Общий helper задаёт read-only rootfs/no escalation/dropALL; static origin не пишет scratch или business data. */}}
          securityContext:
            {{- include "warehouse.security" . | nindent 12 }}
          {{/* Используются общие resources chart. Memory/CPU limits не являются request-body или cache limit. */}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          {{/* GET/ проверяет доступность index.html, но не health API/DB. Без build index сервер возвращает503. */}}
          readinessProbe:
            httpGet: {path: /, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  {{/* ClusterIP доступен Gateway внутри cluster, не открывает web напрямую в host network. */}}
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  {{/* Service8080 направляет на именованный http containerPort8080; gateway.webPort должен соответствовать Service. */}}
  ports:
    - port: 8080
      targetPort: http
{{- end }}
