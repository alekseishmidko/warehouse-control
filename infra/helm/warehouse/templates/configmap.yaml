apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-warehouse-config
  labels:
    app.kubernetes.io/name: warehouse
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
data:
  profile: {{ .Values.profile | required "profile is required" | quote }}
