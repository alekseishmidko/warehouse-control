{{/* Назначение: два независимо управляемых процесса модульного backend из одного image digest.
Ход release: успешный migration hook → Deployment controller создаёт новые Pod → процесс читает ConfigMap/Secret.
Job failure останавливает Helm до обновления этих ресурсов. Новая schema обязана поддерживать старые Pod.
API слушает HTTP; worker опрашивает durable outbox и имеет только probe listener9100. Probes отделяют готовность зависимостей от liveness процесса. */}}
{{/* API/worker — разные процессы одного image. Worker имеет собственные probes без Service/Gateway. */}}
{{- range $role := list "api" "worker" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
spec:
  {{/* Одна replica — local baseline. Surge требует места на том же узле и не доказывает HA. */}}
  replicas: 1
  minReadySeconds: 3
  progressDeadlineSeconds: 180
  {{/* Новый Pod должен пройти readiness и minReadySeconds; surge допускает перекрытие workers, защищённое DB leases/locks. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{/* Instance+component изолируют release и процесс. Selector обязан совпадать с labels Pod и Service. */}}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $role }}
      annotations:
        {{/* Изменение несекретной policy инициирует rollout. Изменение contents внешнего Secret само checksum не меняет. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      {{/* Runtime SA не получает API token/RBAC; DB Secret доступен процессу через env и не печатается chart. */}}
      serviceAccountName: {{ $.Release.Name }}-runtime
      automountServiceAccountToken: false
      {{/* 30s — окно Kubernetes до SIGKILL; штатный worker drain по умолчанию 15s должен завершиться раньше. */}}
      terminationGracePeriodSeconds: 30
      {{/* UID/GID1000 соответствует node в image; seccomp RuntimeDefault ограничивает системные вызовы. */}}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $role }}
          image: {{ include "warehouse.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{/* Node запускается напрямую PID1, без shell. Выбор args разделяет API и worker, не artifacts. */}}
          command: [node]
          args: [{{ if eq $role "api" }}dist/main.js{{ else }}dist/worker.js{{ end }}]
          {{- if eq $role "api" }}
          {{/* Pod уже помечен terminating: EndpointSlice снимает ready, пока API ещё завершает запросы.
          5s дают Gateway время убрать upstream. Бюджет: preStop5s + API drain20s < grace30s. */}}
          lifecycle:
            preStop:
              exec:
                command: [node, -e, "setTimeout(() => {}, 5000)"]
          {{- end }}
          {{/* Helper запрещает privilege escalation/capabilities и делает root filesystem read-only. */}}
          securityContext:
            {{- include "warehouse.security" $ | nindent 12 }}
          {{/* Общие requests/limits используются также в migration/web; нехватка ресурсов оставляет Pod Pending либо вызывает OOMKill. */}}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          {{/* ConfigMap содержит только policy. DATABASE_URL подключён отдельно, чтобы runtime не получил migration owner. */}}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.runtimeSecret }}
                  key: DATABASE_URL
          {{/* Единственная writable scratch area в tmpfs; бизнес-данные и session state хранятся в PostgreSQL. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{/* API и worker имеют собственные listener/port. Worker не публикуется через Service/Gateway. */}}
          ports:
            - name: {{ if eq $role "api" }}http{{ else }}health{{ end }}
              containerPort: {{ if eq $role "api" }}3000{{ else }}9100{{ end }}
          {{/* Startup разрешает медленный init; дальнейший DB outage не перезапускает живой процесс. */}}
          startupProbe:
            httpGet:
              path: /health/startup
              port: {{ if eq $role "api" }}http{{ else }}health{{ end }}
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          {{/* Readiness снимает endpoint при DB outage/drain; активная операция всё равно проверяет ACL/SQL. */}}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ if eq $role "api" }}http{{ else }}health{{ end }}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 1
          {{/* Liveness не обращается к PostgreSQL и не создаёт restart storm при его отказе. */}}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ if eq $role "api" }}http{{ else }}health{{ end }}
            periodSeconds: 10
            timeoutSeconds: 2
      {{/* Memory emptyDir исчезает вместе с Pod; 16Mi ограничивают scratch, а не постоянные складские данные. */}}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
{{- end }}
