# Single-process dev Loki без auth; публикация только loopback, не внешний стенд.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: '2024-04-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
# Retention реализует compactor, одного retention_period недостаточно.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  # Loki не должен автоматически добавлять пятый service_name label.
  discover_service_name: []
  retention_period: 24h
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_query_parallelism: 4
analytics:
  reporting_enabled: false
