# Стабильные UID позволяют versioned dashboards ссылаться на локальные datasources.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # UUID остаётся полем JSON, не Loki label. Regex извлекает только traceId.
        - name: TraceID
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]{32})"'
          datasourceUid: tempo
          url: '$${__value.raw}'
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: false
        customQuery: true
        query: '{service="warehouse-backend"} | json | traceId = "$${__span.traceId}"'
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
