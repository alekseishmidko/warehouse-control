# Единственный получатель внутри сети Compose. Внешних email/Slack/webhook destinations нет.
route:
  receiver: local
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
receivers:
  - name: local
    webhook_configs:
      - url: http://receiver:8080/alerts
        send_resolved: true
